@if (showLayout) {
  <app-header (toggle)="toggleSidebar()"></app-header>

  <app-sidebar
    [isOpen]="sidebarOpen"
    (close)="closeSidebar()">
  </app-sidebar>

  <div class="main-content" [class.sidebar-open]="sidebarOpen">
    <router-outlet></router-outlet>
  </div>
}

@if (!showLayout) {
  <!-- with no showLayout -->
  <router-outlet></router-outlet>
}

<p-toast></p-toast>

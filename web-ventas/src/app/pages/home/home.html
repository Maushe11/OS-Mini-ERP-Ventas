<div class="container mt-5">
  <!-- Encabezado + usuario logueado + botón de logout -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2>Dashboard</h2>
      <p>
        Estás logueado como
        <strong>admin</strong>
        <!-- si luego quieres usar el token para mostrar algo dinámico, ya lo tienes en la clase -->
      </p>
    </div>

    <button class="btn btn-secondary" (click)="logout()">
      Cerrar sesión
    </button>
  </div>

  <!-- KPIs -->
  <div class="row mb-4">
    <div class="col-md-4 mb-3">
      <div class="card text-center p-3">
        <h5>Total ventas</h5>
        <p class="h4 mb-0">
          {{ totalSales | currency: 'PEN':'S/ ' }}
        </p>
      </div>
    </div>

    <div class="col-md-4 mb-3">
      <div class="card text-center p-3">
        <h5>Clientes</h5>
        <p class="h4 mb-0">{{ totalCustomers }}</p>
      </div>
    </div>

    <div class="col-md-4 mb-3">
      <div class="card text-center p-3">
        <h5>Productos</h5>
        <p class="h4 mb-0">{{ totalProducts }}</p>
      </div>
    </div>
  </div>

  <!-- Gráfico de ventas mensuales -->
  <div class="card p-3" style="height: 400px;">
    <h5>Ventas mensuales</h5>

    <p *ngIf="loading">Cargando datos...</p>

    <p-chart
      *ngIf="!loading"
      type="bar"
      [data]="salesChartData"
      [options]="salesChartOptions">
    </p-chart>
  </div>
</div>

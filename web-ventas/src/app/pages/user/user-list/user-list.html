<p-panel header="Gestión de Usuarios">

  <!-- BUSCADOR -->
  <p-inputgroup>
    <input pInputText [ngModel]="filter()" (ngModelChange)="filter.set($event)" (keyup.enter)="onSearch()"
           placeholder="Buscar por username..."/>
    <p-button label="Buscar" icon="pi pi-search" severity="contrast" (click)="onSearch()"/>
  </p-inputgroup>

  <p-divider/>

  <!-- BOTÓN PARA AGREGAR PRODUCTO -->
  <div class="mb-3">
    <p-button
      label="Nuevo Usuario"
      icon="pi pi-plus"
      (click)="openCreateForm()"
      severity="success"
    />
  </div>

  <p-divider/>

  <!-- TABLA -->
  <p-table
    [value]="users()"
    [loading]="loading()"
    sortMode="single"
    (sortFunction)="onSort($event)"
    [paginator]="false"
    [lazy]="true"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="username">
          Username
          <p-sortIcon field="username"></p-sortIcon>
        </th>
        <th>Rol</th>
        <th>F. Creación</th>
        <th>F. Actualización</th>
        <th>Activo</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.username }}</td>
        <td>{{ row.role }}</td>
        <td>{{ row.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ row.updatedAt | date:'dd/MM/yyyy HH:mm' }}</td>
        <td>
          @if (row.active) {
            <p-tag
              severity="success"
              value="Activo">
            </p-tag>
          } @else {
            <p-tag
              severity="danger"
              value="Inactivo">
            </p-tag>
          }
        </td>
        <td>
          <p-button
            icon="pi pi-pencil"
            severity="info"
            (click)="openEditForm(row.id)"
            styleClass="mr-2"
          ></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- PAGINACIÓN -->
  <p-paginator
    [rows]="size()"
    [totalRecords]="totalRecords()"
    [rowsPerPageOptions]="[5, 10, 20]"
    (onPageChange)="onPageChange($event)"
    styleClass="mt-3"
  ></p-paginator>

</p-panel>

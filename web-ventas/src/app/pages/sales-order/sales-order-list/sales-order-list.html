<p-panel header="Gestión de Órdenes de Venta">

  <p-inputgroup>
    <input
      pInputText
      [ngModel]="filter()"
      (ngModelChange)="filter.set($event)"
      (keyup.enter)="onSearch()"
      placeholder="Buscar por cliente o código..."
    />
    <p-button
      label="Buscar"
      icon="pi pi-search"
      severity="contrast"
      (click)="onSearch()"
    />
  </p-inputgroup>

  <p-divider></p-divider>

  <div class="flex justify-content-end mt-3 mb-3">
    <p-button
      label="Nueva Orden"
      icon="pi pi-plus"
      (click)="openCreateForm()"
      severity="success"
    ></p-button>
  </div>

  <p-divider></p-divider>

  <p-table
    [value]="orders()"
    [loading]="loading()"
    [paginator]="false"
    [rows]="size()"
    [totalRecords]="totalRecords()"
    [sortMode]="'single'"
    [responsiveLayout]="'scroll'">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="code">
          Código
          <p-sortIcon field="code"></p-sortIcon>
        </th>
        <th>Cliente</th>
        <th pSortableColumn="orderDate">
          Fecha
          <p-sortIcon field="orderDate"></p-sortIcon>
        </th>
        <th pSortableColumn="total">
          Total
          <p-sortIcon field="total"></p-sortIcon>
        </th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.idOrder }}</td>
        <td>{{ row.customerName }}</td>
        <td>{{ row.date | date : 'dd/MM/yyyy HH:mm' }}</td>
        <td>S/ {{ row.total | number : '1.2-2' }}</td>
        <td>
          @if (row.status === 'REGISTRADO') {
            <p-tag severity="secondary" value="REGISTRADO"></p-tag>
          } @else if (row.status === 'FACTURADO') {
            <p-tag severity="success" value="FACTURADO"></p-tag>
          } @else {
            <p-tag severity="info" value="{{ row.status }}"></p-tag>
          }
        </td>
        <td>
          <p-button
            icon="pi pi-eye"
            severity="info"
            styleClass="mr-2"
            (click)="openDetail(row.idOrder)"
          ></p-button>

          @if (row.status === 'REGISTRADO') {
            <p-button
              icon="pi pi-trash"
              severity="danger"
              (click)="deleteSalesOrder(row.idOrder)"
            ></p-button>
          }

        </td>
      </tr>
    </ng-template>

  </p-table>

  <p-paginator
    [rows]="size()"
    [totalRecords]="totalRecords()"
    [first]="page() * size()"
    (onPageChange)="onPageChange($event)"
    class="mt-3"
  ></p-paginator>

</p-panel>

<p-toast></p-toast>

<p-confirmDialog></p-confirmDialog>

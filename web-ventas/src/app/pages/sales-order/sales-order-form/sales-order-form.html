<p-panel header="Registrar Orden de Venta" styleClass="w-full">

  <div class="grid">
    <div class="col-12 md:col-10 lg:col-8 mx-auto">

      <form (ngSubmit)="submit()" [formGroup]="form" class="p-fluid grid formgrid">

        <div class="field col-12">
          <p-inputgroup>
            <p-inputgroup-addon>
              <i class="pi pi-user"></i>
            </p-inputgroup-addon>

            <p-floatlabel variant="in">
              <p-select
                [filter]="true"
                filterBy="fullName"
                formControlName="customerId"
                [options]="customers()"
                optionLabel="fullName"
                optionValue="id"
                inputId="customerId"
                [showClear]="true"
                class="w-full"
                [invalid]="isInvalid('customerId')"
              ></p-select>
              <label for="customerId">Cliente</label>
            </p-floatlabel>
          </p-inputgroup>

          @if (isInvalid('customerId')) {
            <p-message
              severity="error"
              text="El cliente es obligatorio."
            ></p-message>
          }

        </div>

        <div class="field col-12">
          <p-panel header="Detalle de Productos">

            <p-table
              [value]="details()"
              responsiveLayout="scroll">

              <ng-template pTemplate="header">
                <tr>
                  <th style="width: 40%">Producto</th>
                  <th style="width: 15%">Cantidad</th>
                  <th style="width: 20%">Precio</th>
                  <th style="width: 20%">Subtotal</th>
                  <th style="width: 5%"></th>
                </tr>
              </ng-template>

              <ng-template pTemplate="body" let-row let-rowIndex="rowIndex">
                <tr>
                  <td>
                    <p-select
                      [options]="products()"
                      optionLabel="name"
                      [(ngModel)]="row.product"
                      [ngModelOptions]="{ standalone: true }"
                      (ngModelChange)="onProductChange(rowIndex, $event)"
                      placeholder="Seleccione producto"
                      class="w-full"
                      appendTo="body"
                      [virtualScroll]="true"
                      [virtualScrollItemSize]="32"
                      [filter]="true"
                      filterBy="name"
                    ></p-select>
                  </td>

                  <td>
                    <p-inputNumber
                      [(ngModel)]="row.quantity"
                      [ngModelOptions]="{standalone: true}"
                      (ngModelChange)="onQuantityChange(rowIndex, $event)"
                      [min]="1"
                      [showButtons]="true"
                    ></p-inputNumber>
                  </td>

                  <td>
                    <p-inputNumber
                      [(ngModel)]="row.price"
                      [ngModelOptions]="{standalone: true}"
                      (ngModelChange)="onPriceChange(rowIndex, $event)"
                      mode="currency"
                      currency="PEN"
                      [minFractionDigits]="2"
                      [readonly]="true"
                    ></p-inputNumber>
                  </td>

                  <td>
                    S/ {{ row.subtotal | number : '1.2-2' }}
                  </td>

                  <td class="text-center">
                    <p-button
                      type="button"
                      icon="pi pi-trash"
                      severity="danger"
                      (onClick)="removeDetail(rowIndex)"
                    ></p-button>
                  </td>
                </tr>
              </ng-template>

              <ng-template pTemplate="footer">
                <tr>
                  <td colspan="5">
                    <p-button
                      type="button"
                      icon="pi pi-plus"
                      label="Agregar producto"
                      (onClick)="addDetail()"
                    ></p-button>
                  </td>
                </tr>
              </ng-template>

            </p-table>

            <div class="flex justify-content-end align-items-center mt-3 gap-2">
              <i class="pi pi-wallet text-2xl"></i>
              <h3 class="m-0">Total: S/ {{ total() | number : '1.2-2' }}</h3>
            </div>

          </p-panel>
        </div>

        <div class="field col-12 mt-4">
          <div class="flex gap-5 flex-column md:flex-row">
            <button
              pButton
              type="submit"
              class="w-full md:w-6"
              [disabled]="loading()">
              <i class="pi pi-save" pButtonIcon></i>
              <span pButtonLabel>Guardar Orden</span>
            </button>

            <button
              pButton
              label="Cancelar"
              icon="pi pi-arrow-left"
              severity="secondary"
              class="w-full md:w-6"
              (click)="goBack()"
            ></button>
          </div>
        </div>

      </form>

    </div>
  </div>

</p-panel>

<p-toast></p-toast>

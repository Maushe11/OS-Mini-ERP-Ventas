<p-panel header="Gestión de Productos">

  <!-- BUSCADOR -->
  <p-inputgroup>
    <input
      pInputText
      [ngModel]="filter()"
      (ngModelChange)="filter.set($event)"
      (keyup.enter)="onSearch()"
      placeholder="Buscar por nombre..."
    />
    <p-button
      label="Buscar"
      icon="pi pi-search"
      severity="contrast"
      (click)="onSearch()"
    />
  </p-inputgroup>

  <p-divider/>

  <!-- BOTÓN PARA AGREGAR PRODUCTO -->
  <div class="mb-3">
    <p-button
      label="Nuevo Producto"
      icon="pi pi-plus"
      (click)="openCreateForm()"
      severity="success"
    />
  </div>

  <!-- TABLA -->
  <p-table
    [value]="products()"
    [loading]="loading()"
    sortMode="single"
    (sortFunction)="onSort($event)"
    [paginator]="false"
    [lazy]="true"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name">
          Nombre
          <p-sortIcon field="name"></p-sortIcon>
        </th>
        <th>Descripción</th>
        <th pSortableColumn="price">
          Precio
          <p-sortIcon field="price"></p-sortIcon>
        </th>
        <th>Stock</th>
        <th>Stock Mín.</th>
        <th>Activo</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.name }}</td>
        <td>{{ row.description }}</td>
        <td>S/ {{ row.price | number : '1.2-2' }}</td>
        <td>{{ row.stock }}</td>
        <td>{{ row.minStock }}</td>
        <td>
          @if (row.active) {
            <p-tag
              severity="success"
              value="Activo">
            </p-tag>
          } @else {
            <p-tag
              severity="danger"
              value="Inactivo">
            </p-tag>
          }
        </td>
        <td>
          <p-button
            icon="pi pi-pencil"
            severity="info"
            (click)="openEditForm(row.id)"
            styleClass="mr-2"
          ></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- PAGINADOR -->
  <p-paginator
    [rows]="size()"
    [totalRecords]="totalRecords()"
    [rowsPerPageOptions]="[5, 10, 20]"
    (onPageChange)="onPageChange($event)"
    styleClass="mt-3"
  ></p-paginator>

</p-panel>
